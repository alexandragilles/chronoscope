<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Chronoscope</title>
<meta name="description" content="L'histoire de France de Clovis à 1789, en jeu.">
<meta name="theme-color" content="#16226A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chronoscope">
<style>:root{padding-top:env(safe-area-inset-top,0px)}html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=UnifrakturMaguntia&display=swap">
<style>
:root {
  --bg: #F2E9D2; --bg2: #E9DEC1; --card: #FBF6E6; --ink: #231B14; --ink2: #5E5240; --line: #CDBE98;
  --accent: #2B3E9E; --accent-ink: #FFFFFF; --accent-soft: #DDE1F4;
  --red: #A8362B; --green: #3C7A4B; --good-bg: #DCEBD6; --bad-bg: #F3D6CF;
  --gold: #C79A2B; --silver: #9AA0AE; --bronze: #A8693A; --iron: #6B6860;
  --g-mero: #2F4AA8; --g-caro: #A8362B; --g-eglise: #6B3E91; --g-monde: #3C7A4B;
  --g-capet: #1F6E7A; --g-valois: #9A6B1E; --g-bourbon: #8E3B5C; --g-cour: #4E5A66;
  --m-teal: #1F6E7A; --m-ochre: #9A6B1E; --m-rose: #8E3B5C; --m-slate: #4E5A66;
  --m-blue: #2F4AA8; --m-red: #A8362B; --m-green: #3C7A4B; --m-purple: #6B3E91; --m-sym: #F6EBC8;
  --shadow: 0 2px 0 rgba(60,40,10,.12), 0 8px 18px rgba(60,40,10,.10);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .09 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  --fh: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --fb: 'Alegreya', Georgia, 'Times New Roman', serif;
  --fg: 'UnifrakturMaguntia', 'Cinzel', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12142B; --bg2: #1A1D3C; --card: #1D2145; --ink: #F1E8CF; --ink2: #B9B09A; --line: #363B6E;
    --accent: #E3BE5B; --accent-ink: #1A1630; --accent-soft: #2A2F63;
    --red: #E2705A; --green: #78C08A; --good-bg: #1F3A2B; --bad-bg: #44211F;
    --gold: #E3BE5B; --silver: #B7BDCB; --bronze: #D08B57; --iron: #8D8A82;
    --g-mero: #7C93F0; --g-caro: #E2705A; --g-eglise: #B98AE0; --g-monde: #78C08A;
    --g-capet: #5CC2CF; --g-valois: #E0B05A; --g-bourbon: #E58AAE; --g-cour: #A9B4C0;
    --m-teal: #23808C; --m-ochre: #A97A28; --m-rose: #A04A6C; --m-slate: #5A6672;
    --m-blue: #3A56C4; --m-red: #C04A3A; --m-green: #3F8F57; --m-purple: #7C4DAA; --m-sym: #FBF0CC;
    --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12142B; --bg2: #1A1D3C; --card: #1D2145; --ink: #F1E8CF; --ink2: #B9B09A; --line: #363B6E;
  --accent: #E3BE5B; --accent-ink: #1A1630; --accent-soft: #2A2F63;
  --red: #E2705A; --green: #78C08A; --good-bg: #1F3A2B; --bad-bg: #44211F;
  --gold: #E3BE5B; --silver: #B7BDCB; --bronze: #D08B57; --iron: #8D8A82;
  --g-mero: #7C93F0; --g-caro: #E2705A; --g-eglise: #B98AE0; --g-monde: #78C08A;
    --g-capet: #5CC2CF; --g-valois: #E0B05A; --g-bourbon: #E58AAE; --g-cour: #A9B4C0;
    --m-teal: #23808C; --m-ochre: #A97A28; --m-rose: #A04A6C; --m-slate: #5A6672;
  --m-blue: #3A56C4; --m-red: #C04A3A; --m-green: #3F8F57; --m-purple: #7C4DAA; --m-sym: #FBF0CC;
  --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg) var(--grain); color: var(--ink); font-family: var(--fb); font-size: 18px; line-height: 1.45; margin: 0; padding-inline: 0; padding-block-end: 84px; -webkit-tap-highlight-color: transparent; }
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
button:disabled { cursor: default; }
h1, h2, h3 { font-family: var(--fh); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1rem; text-transform: uppercase; letter-spacing: .09em; color: var(--ink2); margin-top: 1.3rem; margin-bottom: .5rem; }
p { margin: 0 0 .7rem; }
small { font-size: .82rem; color: var(--ink2); }
.ic { width: 1em; height: 1em; fill: currentColor; vertical-align: -.12em; }
.wrap, #view { max-width: 640px; margin-inline: auto; padding-inline: 16px; }
#view { padding-block: 14px 24px; min-height: 60vh; }
.h1 { margin-bottom: .8rem; }
.eyebrow { font-family: var(--fh); text-transform: uppercase; letter-spacing: .14em; font-size: .74rem; color: var(--ink2); margin-bottom: .35rem; }
.lead { color: var(--ink2); font-size: 1.02rem; }
.hint { color: var(--ink2); font-size: .95rem; font-style: italic; }
.empty { color: var(--ink2); text-align: center; padding: 28px 0; font-style: italic; }
.note { font-size: .95rem; color: var(--ink2); }
.note.ok { color: var(--green); font-weight: 700; }

/* en-tête */
#head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg2); border-bottom: 2px solid var(--gold); }
.hd { display: grid; gap: 4px; width: 100%; max-width: 640px; margin-inline: auto; padding: 8px 16px 8px; }
.hd-title { font-family: var(--fg); font-size: 1.5rem; line-height: 1; color: var(--accent); }
.hd-row { display: flex; align-items: center; gap: 12px; font-family: var(--fh); font-size: .85rem; letter-spacing: .04em; }
.hd-rank { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hd-xp { color: var(--ink2); font-variant-numeric: tabular-nums; }
.hd-st { display: inline-flex; gap: 3px; align-items: center; color: var(--ink2); font-variant-numeric: tabular-nums; }
.hd-st.on { color: #D2641E; }
.hd-day { font-size: .78rem; color: var(--ink2); display: grid; gap: 3px; }
.bar { display: block; height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar.thin { height: 5px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #E8C867); border-radius: 6px; transition: width .4s; }

/* barre d'onglets */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center; background: var(--bg2); border-top: 2px solid var(--gold); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs button { flex: 1; max-width: 128px; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; font-family: var(--fh); font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink2); text-align: center; }
#tabs svg { width: 24px; height: 24px; }
#tabs button.on { color: var(--accent); }
#tabs button.on svg { transform: translateY(-1px); }

/* composants */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); font-family: var(--fh); font-weight: 700; letter-spacing: .05em; font-size: .9rem; padding: 12px 20px; border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.28); text-align: center; min-height: 44px; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.btn.sm { padding: 8px 14px; font-size: .8rem; min-height: 38px; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn[disabled] { opacity: .4; }
.btn.bad { background: var(--red); color: #fff; } .btn.mid { background: var(--bronze); color: #fff; } .btn.good { background: var(--green); color: #fff; }
.nav { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.back { font-family: var(--fh); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); padding: 6px 0 12px; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 8px; scrollbar-width: none; margin-bottom: 4px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; padding: 7px 13px; border: 2px solid var(--line); border-radius: 999px; font-family: var(--fh); font-size: .76rem; letter-spacing: .05em; color: var(--ink2); }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.keys { margin-block: 8px; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: .92rem; color: var(--ink); }
button.chip { border-color: currentColor; }
.chip.g-mero { color: var(--g-mero); } .chip.g-caro { color: var(--g-caro); } .chip.g-eglise { color: var(--g-eglise); } .chip.g-monde { color: var(--g-monde); }
.chip.plain { color: var(--ink2); border-style: dashed; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag { display: inline-block; font-family: var(--fh); font-size: .66rem; letter-spacing: .07em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); margin: 0 4px 4px 0; }
.tag.leg { background: var(--bad-bg); }
.tag.lv5, .tag.lv4 { background: var(--gold); color: #231B14; }
.tags { margin: .4rem 0 0; }
.switch { display: flex; gap: 10px; align-items: center; margin-block: 18px 6px; font-size: .95rem; color: var(--ink2); }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.dots { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--gold); }
.dots i.on { background: var(--gold); }
.dots em { font-style: normal; font-size: .78rem; color: var(--ink2); margin-left: 4px; }
.dots.big { justify-content: center; margin-block: 18px 4px; }
.dots.big i { width: 11px; height: 11px; }
.big { font-family: var(--fh); font-size: 3.4rem; font-weight: 700; color: var(--accent); line-height: 1; margin-block: 8px; }
.big small { font-size: 1.2rem; }
.result { text-align: center; padding-block: 8px; }
.toast-box, #toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 112px); z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--ink); color: var(--bg); font-family: var(--fh); font-size: .82rem; letter-spacing: .04em; padding: 9px 16px; border-radius: 10px; box-shadow: var(--shadow); animation: pop .3s ease-out; max-width: 100%; text-align: center; }
.toast.badge { background: var(--gold); color: #231B14; } .toast.rank { background: var(--accent); color: var(--accent-ink); }
@keyframes pop { from { transform: translateY(-8px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

/* médaillons */
.medal { flex: none; display: block; }
.medal .m-ring { fill: var(--iron); }
.medal .m-fill { fill: var(--mc, var(--m-blue)); }
.medal .m-in { fill: none; stroke: var(--m-sym); stroke-width: 1; opacity: .55; }
.medal .m-sym { color: var(--m-sym); }
.medal .m-ray { fill: var(--gold); opacity: .75; }
.medal.g-mero { --mc: var(--m-blue); } .medal.g-caro { --mc: var(--m-red); } .medal.g-eglise { --mc: var(--m-purple); } .medal.g-monde { --mc: var(--m-green); }
.medal.lv2 .m-ring { fill: var(--bronze); } .medal.lv3 .m-ring { fill: var(--silver); }
.medal.lv4 .m-ring, .medal.lv5 .m-ring { fill: var(--gold); }
.emb { flex: none; display: block; }
.emb .e-ring { fill: var(--gold); } .emb .e-fill { fill: var(--m-blue); } .emb .e-sym { color: var(--m-sym); }
.emb.lock .e-ring { fill: var(--iron); } .emb.lock .e-fill { fill: var(--bg2); } .emb.lock .e-sym { color: var(--ink2); }
.emb.done .e-ring { fill: var(--green); }

/* quête */
.intro { margin-bottom: 14px; }
.quip { font-style: italic; color: var(--ink2); margin-top: .5rem; }
.quip span { font-family: var(--fh); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-style: normal; }
.acts { display: grid; gap: 14px; }
.actcard { display: block; width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.actcard.locked { opacity: .62; }
.actcard.done { border-color: var(--green); }
.ac-ban { display: block; height: 96px; overflow: hidden; }
.ac-ban svg, .hub-ban svg { display: block; width: 100%; height: 100%; }
.actcard.locked .ac-ban { filter: grayscale(.9); }
.ac-body { display: flex; gap: 12px; padding: 12px 14px 14px; align-items: flex-start; }
.ac-tx { display: grid; gap: 2px; min-width: 0; }
.ac-num { font-family: var(--fh); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.ac-t { font-family: var(--fh); font-weight: 700; font-size: 1.08rem; line-height: 1.2; }
.ac-s { font-size: .93rem; color: var(--ink2); }
.hub-ban { height: 150px; border-radius: 14px; overflow: hidden; margin-bottom: 14px; border: 2px solid var(--gold); }
.wl { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.wl span { font-size: .84rem; background: var(--bg2); padding: 4px 10px; border-radius: 8px; color: var(--ink2); }
.wl b { color: var(--ink); font-family: var(--fh); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.steps li.ok { border-color: var(--green); }
.st-n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--fh); font-weight: 700; background: var(--bg2); border: 2px solid var(--gold); }
.steps li.ok .st-n { background: var(--green); color: #fff; border-color: var(--green); }
.st-n .ic { width: 18px; height: 18px; }
.st-tx { flex: 1; min-width: 0; display: grid; }
.st-tx b { font-family: var(--fh); font-size: .95rem; }

/* récit */
.scene { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 18px 16px; box-shadow: var(--shadow); }
.sc-year { font-family: var(--fg); font-size: 3.6rem; line-height: 1; color: var(--accent); margin-bottom: 4px; }
.prose { font-size: 1.1rem; margin-top: 12px; }
.minis { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.mini { display: grid; justify-items: center; gap: 2px; width: 74px; text-align: center; font-size: .72rem; font-family: var(--fh); }
.mini span { line-height: 1.1; }

/* dialogue */
.tk-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.tk-head b { font-family: var(--fh); font-size: 1.1rem; display: block; }
.narr { font-style: italic; background: var(--bg2); border-left: 4px solid var(--gold); padding: 12px 14px; border-radius: 0 10px 10px 0; }
.bubble { max-width: 92%; padding: 11px 14px; border-radius: 14px; margin-bottom: 10px; }
.bubble.them { background: var(--card); border: 2px solid var(--line); border-top-left-radius: 4px; }
.bubble.me { background: var(--accent); color: var(--accent-ink); margin-left: auto; border-top-right-radius: 4px; }
.opts { display: grid; gap: 10px; margin-top: 10px; }
.opt { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.opt:not(:disabled):active { background: var(--accent-soft); }
.opt.right { background: var(--good-bg); border-color: var(--green); }
.opt.wrong { background: var(--bad-bg); border-color: var(--red); }
.learn { margin-top: 12px; background: var(--bg2); border-radius: 10px; padding: 10px 14px; border-left: 4px solid var(--gold); }
.learn b { font-family: var(--fh); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.learn p { margin: 4px 0 0; font-size: 1rem; }
.learn.good { border-left-color: var(--green); } .learn.bad { border-left-color: var(--red); }
.q { margin-block: 12px; font-size: 1.2rem; line-height: 1.3; }

/* frise */
.fr-list { list-style: none; margin: 14px 0; padding: 0; display: grid; gap: 8px; }
.fr-it { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.fr-it.dragging { box-shadow: var(--shadow); border-color: var(--accent); background: var(--accent-soft); }
.fr-it.good { border-color: var(--green); background: var(--good-bg); } .fr-it.bad { border-color: var(--red); background: var(--bad-bg); }
.fr-grip { flex: none; display: grid; gap: 3px; padding: 10px 8px; touch-action: none; cursor: grab; }
.fr-grip i { display: block; width: 18px; height: 3px; border-radius: 2px; background: var(--ink2); }
.fr-tx { flex: 1; min-width: 0; display: grid; }
.fr-arr { display: flex; flex-direction: column; gap: 2px; }
.fr-arr button { width: 36px; height: 24px; display: grid; place-items: center; font-size: .7rem; color: var(--ink2); border: 1.5px solid var(--line); border-radius: 6px; }
.fr-fix { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
.fr-fix li { font-size: .95rem; } .fr-fix b { font-family: var(--fh); color: var(--accent); } .fr-fix small { display: block; }

/* fiches */
.filters { display: grid; gap: 2px; margin-bottom: 10px; }
#fq { width: 100%; font: inherit; padding: 11px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); margin-bottom: 6px; }
.flist { display: grid; gap: 8px; }
.pc { display: flex; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px 8px 8px; position: relative; }
.pc.locked { opacity: .6; }
.pc-tx { display: grid; min-width: 0; flex: 1; }
.pc-tx b { font-family: var(--fh); font-size: .98rem; line-height: 1.2; }
.lvl { font-style: normal; font-family: var(--fh); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--bronze); }
.lvl.lv5, .lvl.lv4 { color: var(--gold); }
.seen-ic { position: absolute; top: 8px; right: 10px; color: var(--green); width: 16px; height: 16px; stroke: currentColor; fill: none; }

/* feuille */
#sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sh-back { position: absolute; inset: 0; background: rgba(10,8,25,.55); }
.sh-pan { position: relative; width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; border-top: 3px solid var(--gold); padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 30px rgba(0,0,0,.35); }
.sh-x { position: sticky; top: 0; float: right; margin: -6px -6px 0 8px; font-family: var(--fh); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--bg); z-index: 2; }
.ps-head { display: flex; gap: 14px; align-items: center; }
.ps-head > div { min-width: 0; }
.ps-d, .ps-r { margin: 2px 0 0; color: var(--ink2); font-size: .95rem; }
.ps-one { font-size: 1.15rem; font-style: italic; margin-top: 14px; }
.facts { padding-left: 1.2rem; margin: 0; display: grid; gap: 12px; }
